<svg xmlns="http://www.w3.org/2000/svg" width="880" height="176" viewBox="0 0 880 176" role="img" aria-labelledby="title desc">
  <title id="title">Chiselki</title>
  <desc id="desc">Match identical numbers or find pairs that add up to ten across several difficulty levels. Android · Kotlin · Jetpack Compose.</desc>
  <rect x="1" y="1" width="878" height="174" rx="20" fill="#201f1c" stroke="#424039" stroke-width="2"/>
  <path d="M568 24v128" stroke="#424039"/>
  <g font-family="Segoe UI, DejaVu Sans, sans-serif">
    <text x="46" y="40" fill="#beb7a9" font-size="19">Android · Kotlin · Jetpack Compose</text>
    <text x="44" y="86" fill="#f6f0e4" font-size="38" font-weight="600">Chiselki</text>
    <g fill="#ded6c8" font-size="22">
      <text x="46" y="122">Match identical numbers or find pairs that</text>
      <text x="46" y="150">add up to ten across several difficulty levels.</text>
    </g>
  </g>
  <g>
    <g stroke="#4c483e" fill="#2e2c27"><rect x="632" y="58" width="38" height="40" rx="7"/><rect x="770" y="58" width="38" height="40" rx="7"/></g>
    <g fill="#d8e695"><rect x="678" y="58" width="38" height="40" rx="7"/><rect x="724" y="58" width="38" height="40" rx="7"/><path d="M715 77h10v2h-10z"/></g>
    <g text-anchor="middle" font-family="Consolas, monospace" font-size="21"><text x="651" y="85" fill="#ded6c8">8</text><text x="697" y="85" fill="#272e12">3</text><text x="743" y="85" fill="#272e12">7</text><text x="789" y="85" fill="#ded6c8">4</text></g>
    <text x="720" y="150" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" fill="#beb7a9" font-size="17">3 + 7 = 10</text>
  </g>
</svg>
